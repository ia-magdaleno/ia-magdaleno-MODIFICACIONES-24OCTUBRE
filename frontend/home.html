<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALEBSYS — Inicio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="/scripts/lucide.min.js"></script>
  <style>
    * { font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
    body { background: #0f172a; min-height: 100vh; }

    .module-card {
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      cursor: pointer;
    }
    .module-card:hover:not(.locked) {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
      border-color: rgba(99,179,237,.45);
    }
    .module-card.locked { cursor: default; opacity: .55; }
    .module-card:active:not(.locked) { transform: translateY(-1px); }

    .role-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px;
      font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    }
    .section-title {
      font-size: 9px; font-weight: 900; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(148,163,184,.55);
      margin-bottom: 12px; padding-left: 2px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px; background: rgba(148,163,184,.12);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  </style>
</head>
<body>

<!-- ══ TOPBAR ══════════════════════════════════════════════════ -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-3
               bg-slate-900/95 backdrop-blur border-b border-slate-700/50 shadow-lg">
  <div class="flex items-center gap-3">
    <div class="bg-blue-600 rounded-xl p-2 shadow-lg">
      <svg viewBox="0 0 24 24" class="w-5 h-5 fill-white">
        <path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h12v2H3v-2zm0 4h12v2H3v-2zm0 4h18v2H3v-2z"/>
      </svg>
    </div>
    <div>
      <div class="text-white font-black text-sm tracking-widest uppercase">CALEBSYS</div>
      <div id="hdr-empresa" class="text-slate-400 text-[9px] font-bold uppercase tracking-wider">—</div>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <div id="hdr-clock" class="text-slate-400 text-xs font-bold tabular-nums hidden sm:block"></div>
    <div class="text-right hidden sm:block">
      <div id="hdr-user"   class="text-white font-bold text-xs"></div>
      <div id="hdr-branch" class="text-slate-400 text-[9px] font-semibold uppercase tracking-wider"></div>
    </div>
    <div id="hdr-avatar"
         class="w-9 h-9 rounded-full bg-blue-700 flex items-center justify-center
                text-white font-black text-sm select-none shadow"></div>
    <button onclick="doLogout()"
            class="flex items-center gap-1.5 text-slate-400 hover:text-red-400 transition
                   text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-500/10
                   border border-transparent hover:border-red-500/30">
      <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
      <span class="hidden sm:inline">Salir</span>
    </button>
  </div>
</header>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<main class="pt-20 pb-12 px-4 sm:px-8 max-w-6xl mx-auto">

  <!-- Bienvenida -->
  <div class="mt-6 mb-8">
    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">Panel de acceso</p>
    <h1 id="welcome-name" class="text-white text-2xl font-black leading-tight">Cargando…</h1>
    <div class="mt-2 flex items-center gap-2 flex-wrap">
      <span id="welcome-badge" class="role-badge bg-blue-600/20 text-blue-300 border border-blue-500/30">
        <i data-lucide="shield" class="w-3 h-3"></i>
        <span id="welcome-role">—</span>
      </span>
      <span class="text-slate-600 text-[10px] font-bold uppercase tracking-wider" id="welcome-branch"></span>
      <span class="text-slate-700 text-[10px]">·</span>
      <span id="welcome-date" class="text-slate-600 text-[10px] font-semibold capitalize"></span>
    </div>
  </div>

  <!-- Módulos -->
  <div id="modules-container"></div>

</main>

<!-- ══ SCRIPT ══════════════════════════════════════════════════ -->
<script>
const API_BASE = '/api';
const _tok  = localStorage.getItem('calebsys_token');
const _role = (localStorage.getItem('calebsys_role') || '').trim();
if (!_tok && !_role) window.location.href = '/login';

function doLogout() {
  ['calebsys_token','calebsys_role','calebsys_user','calebsys_branch',
   'calebsys_empresa','pos_cart','pos_active_client'].forEach(k => localStorage.removeItem(k));
  window.location.href = '/login';
}

// ── Reloj ────────────────────────────────────────────────────
(function tick() {
  const el = document.getElementById('hdr-clock');
  if (el) el.textContent = new Date().toLocaleTimeString('es-MX',
    {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  setTimeout(tick, 1000);
})();

// ── Helpers de card ──────────────────────────────────────────
function card(icon, label, desc, gradient, href, badge=null, locked=false) {
  return { icon, label, desc, gradient, href, badge, locked };
}
function soon(icon, label, desc) {
  return card(icon, label, desc, 'from-slate-700 to-slate-800', '#', 'Próximamente', true);
}

// ── Catálogo de módulos reutilizables ────────────────────────
const M = {
  pos:         card('shopping-cart',    'Punto de Venta',      'Registra ventas, cobra y gestiona el carrito',           'from-blue-600 to-blue-700',    '/'),
  cotizaciones:card('file-text',        'Cotizaciones',        'Genera y envía cotizaciones a clientes',                  'from-indigo-600 to-indigo-700','/?view=quotes'),
  clientes:    card('users',            'Clientes',            'Crea, edita y consulta fichas de clientes',               'from-cyan-600 to-cyan-700',    '/?view=clients'),
  cxc:         card('credit-card',      'Cuentas x Cobrar',    'Saldos pendientes, estados de cuenta y cobranza',        'from-teal-600 to-teal-700',    '/admin_shell.html#cxc'),
  inventario:  card('package',          'Inventario',          'Existencias en tiempo real por producto y sucursal',      'from-violet-600 to-violet-700','/admin_shell.html#inventario'),
  inventario_r:card('package',          'Inventario',          'Consulta de existencias (solo lectura)',                   'from-slate-600 to-slate-700',  '/admin_shell.html#inventario', 'Lectura'),
  kardex:      card('bar-chart-2',      'Kardex',              'Movimientos de entradas y salidas por producto',          'from-purple-600 to-purple-700','/admin_shell.html#kardex'),
  productos:   card('box',              'Productos',           'Catálogo completo, precios y categorías',                 'from-blue-600 to-blue-700',    '/admin_shell.html#productos'),
  compras:     card('shopping-bag',     'Compras',             'Órdenes de compra y recepciones de mercancía',            'from-indigo-600 to-indigo-700','/admin_shell.html#compras-ordenes'),
  recepciones: card('truck',            'Recepciones',         'Registra entradas de mercancía de proveedores',           'from-blue-700 to-blue-800',    '/admin_shell.html#compras-recepciones'),
  proveedores: card('building-2',       'Proveedores',         'Fichas, condiciones de compra, escalas y cupos',          'from-cyan-700 to-cyan-800',    '/admin_shell.html#proveedores'),
  cxp:         card('wallet',           'Cuentas x Pagar',     'Deudas con proveedores y vencimientos de pago',           'from-amber-600 to-amber-700',  '/admin_shell.html#cxp'),
  traslados:   card('arrow-left-right', 'Traslados',           'Coordina traslados entre bodegas',                        'from-fuchsia-600 to-fuchsia-700','/admin_shell.html#traslados'),
  devoluciones:card('corner-down-left', 'Devoluciones',        'Recibe y cierra devoluciones autorizadas',                'from-rose-600 to-rose-700',    '/admin_shell.html#devoluciones'),
  corte:       card('calculator',       'Corte de Caja',       'Cierre de turno y reporte del día',                       'from-amber-600 to-amber-700',  '/admin_shell.html#caja'),
  facturas_r:  card('receipt',          'Facturas',            'Consulta de facturas emitidas (solo lectura)',             'from-emerald-600 to-emerald-700','/admin_shell.html#ventas','Lectura'),
  escalas:     card('tag',             'Escalas de Precio',   'Asigna categorías y descuentos de venta por cliente',     'from-green-600 to-green-700',  '/?view=clients'),
  magdo_ai:    card('bot',             'MAGDO AI',            'Asistente inteligente: inventario, deudas y consultas',    'from-blue-500 to-indigo-600',  '/?open=ai'),
  gps:         soon('map-pin',         'GPS Envíos',          'Gestión de rutas de reparto y entrega a domicilio'),
  community:   soon('share-2',         'Community',           'Redes sociales, catálogo digital y pedidos online'),
  contabilidad:soon('book-open',       'Contabilidad',        'Módulo contable, CFDI masivo y reportes fiscales'),
  rh:          card('user-check',      'Recursos Humanos',    'Personal, roles, horarios y reloj checador',               'from-slate-600 to-slate-700',  '/admin_shell.html#rh'),
  configuracion:card('settings',       'Configuración',       'Empresa, sucursales, impresoras y preferencias',           'from-slate-700 to-slate-800',  '/admin_shell.html#config'),
  plugins:     card('grid',            'Módulos / Plugins',   'Activa o desactiva módulos del sistema',                   'from-slate-700 to-slate-800',  '/admin_shell.html#plugins'),
  admin_ventas:card('bar-chart',       'Ventas',              'Historial completo de ventas y devoluciones',              'from-blue-600 to-blue-700',    '/admin_shell.html#ventas'),
  admin_dash:  card('layout-dashboard','Dashboard',           'Resumen general: ventas, caja, inventario y alertas',      'from-indigo-700 to-indigo-800','/os'),
};

// ── Definición de roles ──────────────────────────────────────
const ROLES = {

  vendedor: {
    label: 'Vendedor', badgeClass: 'bg-blue-600/20 text-blue-300 border-blue-500/30',
    sections: [
      { title: 'Ventas',    cards: [M.pos, M.cotizaciones] },
      { title: 'Clientes',  cards: [M.clientes, M.cxc] },
      { title: 'Consulta',  cards: [M.inventario_r, M.gps, M.magdo_ai] },
    ]
  },

  cajero: {
    label: 'Cajero', badgeClass: 'bg-green-600/20 text-green-300 border-green-500/30',
    sections: [
      { title: 'Caja y Cobros', cards: [M.pos, M.corte, M.facturas_r] },
      { title: 'Clientes',      cards: [M.clientes, M.cxc] },
      { title: 'Asistente',     cards: [M.magdo_ai] },
    ]
  },

  almacenista: {
    label: 'Almacenista', badgeClass: 'bg-violet-600/20 text-violet-300 border-violet-500/30',
    sections: [
      { title: 'Inventario',        cards: [M.productos, M.inventario, M.kardex] },
      { title: 'Compras y Entradas',cards: [M.compras, M.recepciones] },
      { title: 'Movimientos',       cards: [M.traslados, M.devoluciones, M.magdo_ai] },
    ]
  },

  comprador: {
    label: 'Comprador', badgeClass: 'bg-amber-600/20 text-amber-300 border-amber-500/30',
    sections: [
      { title: 'Compras',     cards: [M.proveedores, M.compras, M.recepciones] },
      { title: 'Finanzas',    cards: [M.cxp, M.inventario_r] },
      { title: 'Asistente',   cards: [M.magdo_ai] },
    ]
  },

  cartera: {
    label: 'Cartera', badgeClass: 'bg-teal-600/20 text-teal-300 border-teal-500/30',
    sections: [
      { title: 'Clientes y Crédito', cards: [M.clientes, M.cxc, M.escalas] },
      { title: 'Asistente',          cards: [M.magdo_ai] },
    ]
  },

  gerente: {
    label: 'Gerente de Sucursal', badgeClass: 'bg-red-600/20 text-red-300 border-red-500/30',
    sections: [
      { title: 'Gestión',        cards: [M.admin_dash, M.admin_ventas, M.corte] },
      { title: 'Autorización',   cards: [M.devoluciones, M.traslados] },
      { title: 'Administración', cards: [M.clientes, M.rh, M.magdo_ai] },
    ]
  },

  // Admin/Dueño → redirige a /os directamente (ver resolveRoleKey)
};

// Admin panel sections (referencia, no se usa en home.html — va en /os)
// ADMINISTRACIÓN · VENTAS POS · ALMACÉN · COMPRAS · CARTERA
// GPS ENVÍOS · COMMUNITY · CONTABILIDAD · MAGDO AI · CONFIGURACIÓN

// ── Resolver rol al key del mapa ─────────────────────────────
function resolveRoleKey(raw) {
  const r = (raw || '').toLowerCase().trim();
  if (['vendedor','operador ventas','supervisor','solo lectura'].includes(r)) return 'vendedor';
  if (['cajero','operador caja'].includes(r))                                  return 'cajero';
  if (['almacenista','almacen','operador almacén','operador almacen'].includes(r)) return 'almacenista';
  if (['comprador','jefe de compras','gestor de compras'].includes(r))         return 'comprador';
  if (['cartera','gestor de cartera','analista cartera','cobrador'].includes(r)) return 'cartera';
  if (['gerente','gerente sucursal','gerente de sucursal'].includes(r))        return 'gerente';
  // Admin/Dueño → OS
  if (['admin','administrador','dueño','dueno','owner',
       'administrador general','dueño-gerente general'].includes(r)) {
    window.location.href = '/os'; return null;
  }
  return 'vendedor'; // fallback
}

// ── Render ───────────────────────────────────────────────────
function renderCard(c) {
  const lockedClass = c.locked ? 'locked' : '';
  const action = c.locked ? '' : `onclick="window.location.href='${c.href}'"`;

  let badgeHtml = '';
  if (c.badge === 'Próximamente') {
    badgeHtml = `<span class="inline-flex items-center gap-1 mt-2 px-2 py-0.5 rounded-full
                   text-[9px] font-black uppercase tracking-wider bg-slate-600/40 text-slate-400">
                   <i data-lucide="clock" class="w-2.5 h-2.5"></i> Próximamente</span>`;
  } else if (c.badge === 'Lectura') {
    badgeHtml = `<span class="inline-flex items-center gap-1 mt-2 px-2 py-0.5 rounded-full
                   text-[9px] font-black uppercase tracking-wider bg-amber-500/15 text-amber-400">
                   <i data-lucide="eye" class="w-2.5 h-2.5"></i> Solo lectura</span>`;
  } else if (c.badge) {
    badgeHtml = `<span class="inline-block mt-2 px-2 py-0.5 rounded-full
                   text-[9px] font-black uppercase tracking-wider bg-white/10 text-white/50">${c.badge}</span>`;
  }

  return `
    <div class="module-card ${lockedClass} bg-slate-800/80 border border-slate-700/60
                 rounded-2xl p-5 flex flex-col gap-3 select-none" ${action}>
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br ${c.gradient}
                  flex items-center justify-center shadow-lg flex-shrink-0">
        <i data-lucide="${c.icon}" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <div class="text-white font-black text-sm leading-tight">${c.label}</div>
        <div class="text-slate-400 text-[11px] font-medium mt-1 leading-relaxed">${c.desc}</div>
        ${badgeHtml}
      </div>
    </div>`;
}

// ── Init ─────────────────────────────────────────────────────
async function initHome() {
  document.getElementById('welcome-date').textContent =
    new Date().toLocaleDateString('es-MX',
      {weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const roleKey = resolveRoleKey(_role);
  if (!roleKey) return;

  const cfg = ROLES[roleKey];
  if (!cfg) { window.location.href = '/os'; return; }

  // Info de sesión desde API
  let userName   = localStorage.getItem('calebsys_user')   || 'Usuario';
  let branchName = localStorage.getItem('calebsys_branch') || '';
  let empresaName = 'CALEBSYS';

  try {
    const r = await fetch(`${API_BASE}/auth/me`,
      { headers: { Authorization: `Bearer ${_tok}` } });
    if (r.ok) {
      const me = await r.json();
      userName    = me.full_name || me.username || userName;
      branchName  = me.sucursal_name || branchName;
      empresaName = me.empresa_name  || empresaName;
    }
  } catch(_) {}

  // Header
  document.getElementById('hdr-empresa').textContent = empresaName.toUpperCase();
  document.getElementById('hdr-user').textContent    = userName;
  document.getElementById('hdr-branch').textContent  = branchName || _role;
  document.getElementById('hdr-avatar').textContent  =
    userName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  // Bienvenida
  document.getElementById('welcome-name').textContent =
    `Hola, ${userName.split(' ')[0]}`;
  document.getElementById('welcome-role').textContent   = cfg.label;
  document.getElementById('welcome-branch').textContent = branchName;

  const badge = document.getElementById('welcome-badge');
  badge.className = `role-badge border ${cfg.badgeClass}`;

  // Secciones
  const container = document.getElementById('modules-container');
  container.innerHTML = cfg.sections.map(sec => `
    <div class="mb-8">
      <div class="section-title">${sec.title}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        ${sec.cards.map(renderCard).join('')}
      </div>
    </div>
  `).join('');

  lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', initHome);
</script>
</body>
</html>
