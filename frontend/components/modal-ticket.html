<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden select-none" id="modal-ticket">
<div class="bg-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col items-center">
<!-- Receipt Box mimicking thermal print -->
<div class="bg-white text-black p-6 w-[320px] shadow-lg border-2 border-slate-300 rounded-md font-mono text-xs select-text overflow-y-auto max-h-[70vh] custom-scrollbar" id="thermal-ticket-container">
<!-- Content will be injected dynamically -->
</div>
<!-- Controls -->
<div class="mt-4 flex gap-3 select-none font-montserrat font-bold">
<button class="bg-[#2563eb] hover:bg-blue-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-1.5" onclick="openPrintShareFlow()">
<i class="w-4 h-4 text-[#8afcfd]" data-lucide="printer"></i>
<span>Imprimir / Enviar</span>
</button>
<button class="bg-slate-600 hover:bg-slate-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-1.5" onclick="closeTicketModal()">
<i class="w-4 h-4" data-lucide="check"></i>
<span>Aceptar (Enter)</span>
</button>
</div>
</div>
</div>
