<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden select-none" id="modal-client-historial">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[800px] max-h-[88vh] flex flex-col overflow-hidden font-montserrat">
<div class="bg-gradient-to-r from-slate-800 to-slate-900 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-[#8afcfd]" data-lucide="history"></i>
<h3 class="font-black text-white text-sm uppercase">Historial de Compras</h3>
<span class="bg-slate-700 text-slate-300 font-bold text-[9px] px-2 py-0.5 rounded">F10</span>
</div>
<span class="text-slate-300 font-bold text-xs" id="historial-client-name">-</span>
<button class="text-slate-300 hover:text-white" onclick="closeModal('modal-client-historial')"><i class="w-5 h-5" data-lucide="x"></i></button>
</div>
<div class="p-5 flex-1 overflow-y-auto">
<!-- Stats row -->
<div class="grid grid-cols-4 gap-3 mb-4 text-center">
<div class="bg-slate-50 border border-slate-100 rounded-2xl p-3">
<p class="text-xl font-black text-slate-800" id="hist-total-purchases">0</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">Compras</p>
</div>
<div class="bg-blue-50 border border-blue-100 rounded-2xl p-3">
<p class="text-xl font-black text-blue-700" id="hist-total-amount">$0.00</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">Total Gastado</p>
</div>
<div class="bg-green-50 border border-green-100 rounded-2xl p-3">
<p class="text-xl font-black text-green-700" id="hist-avg-ticket">$0.00</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">Ticket Promedio</p>
</div>
<div class="bg-amber-50 border border-amber-100 rounded-2xl p-3">
<p class="text-xl font-black text-amber-700" id="hist-last-purchase">-</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">Última Compra</p>
</div>
</div>
<!-- Sales table -->
<div class="border border-slate-100 rounded-2xl overflow-hidden">
<table class="w-full text-xs border-collapse text-left">
<thead class="bg-slate-50 text-slate-400 font-bold border-b border-slate-100">
<tr>
<th class="py-2.5 px-4">FOLIO</th>
<th class="py-2.5 px-4">FECHA</th>
<th class="py-2.5 px-4">ARTÍCULOS</th>
<th class="py-2.5 px-4">PAGO</th>
<th class="py-2.5 px-4 text-right">TOTAL</th>
<th class="py-2.5 px-4 text-center">TICKET</th>
</tr>
</thead>
<tbody class="divide-y divide-slate-50 font-bold text-slate-700" id="historial-table-body">
<tr><td class="text-center py-6 text-slate-400" colspan="6">Sin historial de compras</td></tr>
</tbody>
</table>
</div>
<div class="mt-4 flex justify-between">
<button class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-xl transition text-xs flex items-center gap-1.5" onclick="exportClientHistorial()">
<i class="w-3.5 h-3.5" data-lucide="download"></i> Exportar CSV
          </button>
<button class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-xl transition text-xs" onclick="closeModal('modal-client-historial')">Cerrar (Esc)</button>
</div>
</div>
</div>
</div>
