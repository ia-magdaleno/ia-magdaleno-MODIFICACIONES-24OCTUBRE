<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden select-none" id="modal-delivery">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[500px] max-w-full flex flex-col overflow-hidden font-montserrat font-bold">
<!-- Header -->
<div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-slate-500" data-lucide="truck"></i>
<h3 class="font-bold text-slate-700 text-sm">Datos de Entrega a Domicilio (F6)</h3>
</div>
<span class="bg-slate-200 text-slate-600 font-bold text-[9px] px-2 py-0.5 rounded">ESC para salir</span>
</div>
<!-- Body -->
<form class="p-5 space-y-3.5 text-xs" id="delivery-details-form" onsubmit="saveDeliveryDetails(event)">
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="delivery-street">Calle y Número</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="delivery-street" placeholder="ej. Hidalgo #104 o Av. Juárez" type="text"/>
</div>
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="delivery-colony">Colonia</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="delivery-colony" placeholder="ej. Centro o Col. Flores" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="delivery-phone">Teléfono Contacto</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="delivery-phone" placeholder="ej. 6121234567" type="text"/>
</div>
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="delivery-date">Fecha de Entrega</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="delivery-date" type="date"/>
</div>
</div>
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="delivery-notes">Notas / Instrucciones</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="delivery-notes" placeholder="ej. Portón café de reja alta..." type="text"/>
</div>
<div class="pt-2 flex justify-end">
<button class="bg-[#2563eb] hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-2xl transition shadow-md shadow-blue-100 flex items-center gap-1.5" type="submit">
<i class="w-4 h-4" data-lucide="check"></i>
<span>Guardar Detalles (Enter)</span>
</button>
</div>
</form>
</div>
</div>
