<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden select-none" id="modal-apartados">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[500px] max-w-full flex flex-col overflow-hidden font-montserrat font-bold">
<!-- Header -->
<div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-slate-500" data-lucide="package"></i>
<h3 class="font-bold text-slate-700 text-sm">Apartados de Mercancía (F5)</h3>
</div>
<span class="bg-slate-200 text-slate-600 font-bold text-[9px] px-2 py-0.5 rounded">ESC para salir</span>
</div>
<!-- Body -->
<form class="p-5 space-y-3.5 text-xs" id="apartado-form" onsubmit="submitApartado(event)">
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase">Cliente</label>
<span class="text-slate-800 font-extrabold text-sm block" id="apartado-client-display">PUBLICO EN GENERAL</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="apartado-anticipo">Monto de Anticipo ($) *</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="apartado-anticipo" placeholder="0.00" required="" step="any" type="number"/>
</div>
<div>
<label class="block text-[10px] text-slate-400 mb-1 uppercase" for="apartado-date">Fecha Límite Retiro</label>
<input class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-sm font-semibold text-slate-800" id="apartado-date" type="date"/>
</div>
</div>
<div class="pt-2 flex justify-end">
<button class="bg-[#2563eb] hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-2xl transition shadow-md flex items-center gap-1.5" type="submit">
<i class="w-4 h-4" data-lucide="check"></i>
<span>Confirmar Apartado (Enter)</span>
</button>
</div>
</form>
</div>
</div>
