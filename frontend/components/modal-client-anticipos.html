<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden select-none" id="modal-client-anticipos">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[600px] max-h-[85vh] flex flex-col overflow-hidden font-montserrat">
<div class="bg-gradient-to-r from-teal-600 to-teal-700 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-white" data-lucide="wallet"></i>
<h3 class="font-black text-white text-sm uppercase">Anticipos / Saldo a Favor</h3>
<span class="bg-teal-800 text-teal-200 font-bold text-[9px] px-2 py-0.5 rounded">F8</span>
</div>
<button class="text-teal-200 hover:text-white" onclick="closeModal('modal-client-anticipos')"><i class="w-5 h-5" data-lucide="x"></i></button>
</div>
<div class="p-5 flex-1 overflow-y-auto space-y-4">
<!-- Balance summary -->
<div class="bg-teal-50 border border-teal-100 rounded-2xl p-4 flex items-center justify-between">
<div>
<p class="text-[10px] text-teal-600 font-black uppercase">Cliente</p>
<p class="font-black text-slate-800" id="anticipos-client-name">-</p>
</div>
<div class="text-right">
<p class="text-3xl font-black text-teal-700" id="anticipos-balance">$0.00</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">Saldo a Favor</p>
</div>
</div>
<!-- Full ledger table -->
<div>
<p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Bóveda Inmutable de Movimientos</p>
<div class="border border-slate-100 rounded-2xl overflow-hidden max-h-72 overflow-y-auto custom-scrollbar">
<table class="w-full text-[11px] border-collapse text-left">
<thead class="bg-slate-50 text-slate-400 font-bold border-b border-slate-100 sticky top-0">
<tr>
<th class="py-2.5 px-3">#</th>
<th class="py-2.5 px-3">FECHA</th>
<th class="py-2.5 px-3">DETALLE</th>
<th class="py-2.5 px-3 text-right">MONTO</th>
<th class="py-2.5 px-3 text-right">SALDO</th>
</tr>
</thead>
<tbody class="divide-y divide-slate-50 font-bold text-slate-700" id="anticipos-ledger-body">
<tr><td class="text-center py-4 text-slate-400" colspan="5">Sin movimientos</td></tr>
</tbody>
</table>
</div>
<p class="text-[9px] text-slate-300 mt-1 text-right">🔒 Ledger inmutable — No se permite editar ni eliminar transacciones</p>
</div>
<div class="flex justify-end">
<button class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-xl transition text-xs" onclick="closeModal('modal-client-anticipos')">Cerrar (Esc)</button>
</div>
</div>
</div>
</div>
