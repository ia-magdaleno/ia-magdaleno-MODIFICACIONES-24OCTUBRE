<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden select-none" id="modal-receivables">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[700px] max-w-full max-h-[85vh] flex flex-col overflow-hidden font-montserrat font-bold">
<!-- Header -->
<div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-slate-500" data-lucide="wallet"></i>
<h3 class="font-bold text-slate-700 text-sm">Cuentas por Cobrar Pendientes (F4)</h3>
</div>
<span class="bg-slate-200 text-slate-600 font-bold text-[9px] px-2 py-0.5 rounded">ESC para salir</span>
</div>
<!-- Body -->
<div class="p-5 flex-1 flex flex-col overflow-hidden font-montserrat text-xs">
<div class="flex-1 overflow-auto border border-slate-200 rounded-2xl mb-3">
<table class="w-full border-collapse text-left">
<thead class="bg-slate-50 border-b border-slate-200 sticky top-0">
<tr>
<th class="py-2 px-3 text-slate-400 text-[10px]" scope="col">Cliente</th>
<th class="py-2 px-3 text-slate-400 text-[10px] text-center w-24" scope="col">Venta ID</th>
<th class="py-2 px-3 text-slate-400 text-[10px] text-right w-28" scope="col">Total Original</th>
<th class="py-2 px-3 text-slate-400 text-[10px] text-right w-28" scope="col">Saldo Pendiente</th>
</tr>
</thead>
<tbody class="divide-y divide-slate-100" id="receivable-debts-body"></tbody>
</table>
</div>
<div class="hidden p-3.5 bg-green-50 border border-green-100 rounded-2xl" id="payment-debt-section">
<div class="flex items-center justify-between gap-4">
<div>
<span class="block text-[10px] text-green-500 uppercase">ABONO A CUENTA</span>
<span class="text-green-900 font-extrabold" id="payment-selected-client"></span>
</div>
<div class="w-32">
<label class="block text-[10px] text-green-500 uppercase" for="payment-amount-input">CANTIDAD ABONO ($)</label>
<input class="w-full bg-white border border-green-200 rounded-xl px-3 py-1.5 text-right font-black text-green-950" id="payment-amount-input" placeholder="0.00" step="any" type="number"/>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="bg-slate-50 border-t border-slate-200 px-5 py-3 flex items-center justify-between text-xs text-slate-500 font-montserrat">
<span>Arrow keys para navegar | ENTER para abonar | ESC para salir</span>
<button class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl transition" onclick="closeModal('modal-receivables')">Cerrar</button>
</div>
</div>
</div>
