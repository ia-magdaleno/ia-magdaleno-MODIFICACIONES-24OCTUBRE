<!-- COMPONENT: Topbar -->
<!-- This is a reference file. The topbar is embedded directly in admin_shell.html -->
<header class="topbar">
  <div class="topbar-breadcrumb">
    <span>Calebsys</span>
    <i class="fa-solid fa-chevron-right"></i>
    <span class="current" id="topbar-current-page">Dashboard</span>
  </div>
  <div class="topbar-actions">
    <div class="tb-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Buscar módulo..." id="global-search">
    </div>
    <div class="status-chip">
      <div class="dot"></div>
      Online
    </div>
    <div class="tb-btn" title="Notificaciones">
      <i class="fa-solid fa-bell"></i>
      <div class="notif-dot"></div>
    </div>
    <div class="tb-btn" title="Ir al POS" onclick="window.location.href='/'">
      <i class="fa-solid fa-store"></i>
    </div>
  </div>
</header>
