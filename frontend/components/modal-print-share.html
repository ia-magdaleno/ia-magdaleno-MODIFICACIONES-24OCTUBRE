<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 hidden" id="modal-print-share" role="dialog">
<div class="bg-white rounded-3xl shadow-2xl w-[480px] max-w-full font-montserrat overflow-hidden">
<!-- PASO 1: FORMATO -->
<div id="ps-step-1">
<div class="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-[#8afcfd]" data-lucide="layout"></i>
<h3 class="font-black text-white text-sm uppercase tracking-wide">Selecciona el Formato</h3>
</div>
<span class="bg-slate-700 text-slate-300 text-[9px] font-bold px-2 py-0.5 rounded">PASO 1 / 3</span>
</div>
<div class="p-6 grid grid-cols-2 gap-4">
<!-- TICKET 80mm -->
<button class="group border-2 border-slate-200 hover:border-blue-500 rounded-2xl p-5 flex flex-col items-center gap-3 transition-all hover:shadow-lg hover:shadow-blue-100" onclick="psPaso2('ticket')">
<div class="w-16 h-20 bg-slate-50 border border-slate-200 rounded-lg flex flex-col items-center justify-center gap-1 group-hover:border-blue-200 group-hover:bg-blue-50 transition-all">
<div class="w-10 h-1 bg-slate-300 rounded group-hover:bg-blue-300"></div>
<div class="w-10 h-1 bg-slate-300 rounded group-hover:bg-blue-300"></div>
<div class="w-8 h-1 bg-slate-200 rounded group-hover:bg-blue-200"></div>
<div class="w-10 h-1 bg-slate-300 rounded group-hover:bg-blue-300"></div>
<div class="w-6 h-1 bg-slate-200 rounded group-hover:bg-blue-200"></div>
</div>
<div>
<div class="font-black text-slate-800 text-sm text-center">TICKET</div>
<div class="text-[10px] text-slate-400 text-center">80mm Térmico</div>
</div>
</button>
<!-- CARTA MEMBRETADA -->
<button class="group border-2 border-slate-200 hover:border-indigo-500 rounded-2xl p-5 flex flex-col items-center gap-3 transition-all hover:shadow-lg hover:shadow-indigo-100" onclick="psPaso2('carta')">
<div class="w-16 h-20 bg-slate-50 border border-slate-200 rounded-lg flex flex-col p-1.5 gap-0.5 group-hover:border-indigo-200 group-hover:bg-indigo-50 transition-all">
<div class="w-full h-3 bg-slate-300 rounded-sm group-hover:bg-indigo-300"></div>
<div class="w-full h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
<div class="w-2/3 h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
<div class="w-full h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
<div class="w-2/3 h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
<div class="w-full h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
<div class="w-1/2 h-0.5 bg-slate-200 rounded group-hover:bg-indigo-200"></div>
</div>
<div>
<div class="font-black text-slate-800 text-sm text-center">CARTA</div>
<div class="text-[10px] text-slate-400 text-center">A4 Membretado</div>
</div>
</button>
</div>
<div class="px-6 pb-4 flex justify-end">
<button class="text-slate-400 hover:text-slate-600 font-bold text-xs" onclick="closePrintShareFlow()">Cancelar</button>
</div>
</div>
<!-- PASO 2: ACCIÓN -->
<div class="hidden" id="ps-step-2">
<div class="bg-gradient-to-r from-blue-700 to-blue-800 px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-blue-200" data-lucide="send"></i>
<h3 class="font-black text-white text-sm uppercase tracking-wide">¿Cómo deseas enviarlo?</h3>
</div>
<span class="bg-blue-900 text-blue-200 text-[9px] font-bold px-2 py-0.5 rounded">PASO 2 / 3</span>
</div>
<div class="px-6 pt-4 hidden" id="ps-carta-options">
<label class="flex items-center gap-3 p-3 bg-blue-50 border border-blue-100 rounded-xl cursor-pointer hover:bg-blue-100 transition">
<input class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" id="ps-carta-images" type="checkbox"/>
<div>
<div class="text-xs font-black text-blue-900">Incluir imágenes de los productos</div>
<div class="text-[10px] text-blue-700 leading-tight">Mostrar foto del catálogo en la tabla (solo formato Carta)</div>
</div>
</label>
</div>
<div class="p-6 grid grid-cols-2 gap-4">
<!-- IMPRIMIR -->
<button class="group border-2 border-slate-200 hover:border-blue-500 rounded-2xl p-5 flex flex-col items-center gap-3 transition-all hover:shadow-lg" onclick="psImprimir()">
<div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center group-hover:bg-blue-100 transition-all">
<i class="w-7 h-7 text-blue-600" data-lucide="printer"></i>
</div>
<div class="text-center">
<div class="font-black text-slate-800 text-sm">IMPRIMIR</div>
<div class="text-[10px] text-slate-400">Impresora física</div>
</div>
</button>
<!-- ENVIAR -->
<button class="group border-2 border-slate-200 hover:border-green-500 rounded-2xl p-5 flex flex-col items-center gap-3 transition-all hover:shadow-lg" onclick="psPaso3()">
<div class="w-14 h-14 bg-green-50 rounded-2xl flex items-center justify-center group-hover:bg-green-100 transition-all">
<i class="w-7 h-7 text-green-600" data-lucide="share-2"></i>
</div>
<div class="text-center">
<div class="font-black text-slate-800 text-sm">ENVIAR</div>
<div class="text-[10px] text-slate-400">Digital / Redes</div>
</div>
</button>
</div>
<div class="px-6 pb-4 flex justify-between">
<button class="text-slate-400 hover:text-slate-600 font-bold text-xs flex items-center gap-1" onclick="psPaso1()"><i class="w-3 h-3" data-lucide="arrow-left"></i> Atrás</button>
<button class="text-slate-400 hover:text-slate-600 font-bold text-xs" onclick="closePrintShareFlow()">Cancelar</button>
</div>
</div>
<!-- PASO 3: CANAL DE ENVÍO -->
<div class="hidden" id="ps-step-3">
<div class="bg-gradient-to-r from-green-600 to-green-700 px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-green-100" data-lucide="share-2"></i>
<h3 class="font-black text-white text-sm uppercase tracking-wide">Enviar por...</h3>
</div>
<span class="bg-green-800 text-green-200 text-[9px] font-bold px-2 py-0.5 rounded">PASO 3 / 3</span>
</div>
<div class="p-6 space-y-3">
<!-- WhatsApp -->

</div>
<div class="flex-1 text-left">
<div class="font-black text-slate-800 text-sm">WhatsApp</div>
<div class="text-[10px] text-slate-400">Envía cotización + liga de pago</div>
</div>
<i class="w-4 h-4 text-slate-300 group-hover:text-green-500" data-lucide="chevron-right"></i>
</button>
<!-- Correo Electrónico -->
<button class="w-full flex items-center gap-4 p-4 border-2 border-slate-100 hover:border-blue-400 rounded-2xl hover:bg-blue-50 transition-all group" onclick="psEnviarEmail()">
<div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
<i class="w-5 h-5 text-white" data-lucide="mail"></i>
</div>
<div class="flex-1 text-left">
<div class="font-black text-slate-800 text-sm">Correo Electrónico</div>
<div class="text-[10px] text-slate-400">PDF + liga de pago automática</div>
</div>
<i class="w-4 h-4 text-slate-300 group-hover:text-blue-500" data-lucide="chevron-right"></i>
</button>
<!-- Facebook -->
<button class="w-full flex items-center gap-4 p-4 border-2 border-slate-100 hover:border-indigo-400 rounded-2xl hover:bg-indigo-50 transition-all group" onclick="psEnviarFacebook()">
<div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0">
<svg class="w-5 h-5 text-white fill-current" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
</div>
<div class="flex-1 text-left">
<div class="font-black text-slate-800 text-sm">Facebook Messenger</div>
<div class="text-[10px] text-slate-400">Comparte en tu página</div>
</div>
<i class="w-4 h-4 text-slate-300 group-hover:text-indigo-500" data-lucide="chevron-right"></i>
</button>
<!-- BLOQUE LIGA DE PAGO -->
<div class="mt-3 p-4 bg-amber-50 border border-amber-200 rounded-2xl">
<div class="text-[10px] font-black text-amber-700 uppercase tracking-wider mb-2">⚡ Liga de pago automática</div>
<div class="grid grid-cols-3 gap-2">
<button class="ps-pago-btn border border-amber-300 hover:border-amber-500 hover:bg-amber-100 rounded-xl p-2 text-center transition" id="ps-pago-paypal" onclick="psSetPago('paypal')">
<div class="text-[11px] font-black text-blue-700">PayPal</div>
</button>
<button class="ps-pago-btn border border-amber-300 hover:border-amber-500 hover:bg-amber-100 rounded-xl p-2 text-center transition" id="ps-pago-ml" onclick="psSetPago('ml')">
<div class="text-[11px] font-black text-amber-700">MercadoPago</div>
</button>
<button class="ps-pago-btn border border-amber-300 hover:border-amber-500 hover:bg-amber-100 rounded-xl p-2 text-center transition" id="ps-pago-banco" onclick="psSetPago('banco')">
<div class="text-[11px] font-black text-slate-700">Transferencia</div>
</button>
</div>
<div class="mt-2 text-[10px] text-amber-600 font-semibold hidden" id="ps-pago-selected"></div>
</div>
</div>
<div class="px-6 pb-4 flex justify-between">
<button class="text-slate-400 hover:text-slate-600 font-bold text-xs flex items-center gap-1" onclick="psPaso2()"><i class="w-3 h-3" data-lucide="arrow-left"></i> Atrás</button>
<button class="text-slate-400 hover:text-slate-600 font-bold text-xs" onclick="closePrintShareFlow()">Cancelar</button>
</div>
</div>
</div>
