<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden select-none" id="modal-client-points">
<div class="bg-white rounded-3xl border border-purple-200 shadow-2xl w-[550px] max-h-[80vh] flex flex-col overflow-hidden font-montserrat">
<div class="bg-gradient-to-r from-purple-600 to-purple-700 px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="w-5 h-5 text-yellow-300" data-lucide="star"></i>
<h3 class="font-black text-white text-sm uppercase tracking-wide">Puntos de Fidelidad</h3>
<span class="bg-purple-800 text-purple-200 font-bold text-[9px] px-2 py-0.5 rounded">F3</span>
</div>
<button class="text-purple-200 hover:text-white" onclick="closeModal('modal-client-points')"><i class="w-5 h-5" data-lucide="x"></i></button>
</div>
<div class="p-5 flex-1 overflow-y-auto space-y-4">
<!-- Client name badge -->
<div class="flex items-center gap-3 bg-purple-50 border border-purple-100 rounded-2xl p-3">
<div class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center font-black text-sm" id="points-client-avatar">- -</div>
<div>
<p class="font-black text-slate-800 text-sm" id="points-client-name">-</p>
<p class="text-xs text-slate-400">Saldo de puntos actual</p>
</div>
<div class="ml-auto text-right">
<p class="text-2xl font-black text-purple-700" id="points-balance-display">0</p>
<p class="text-[10px] text-slate-400 font-bold uppercase">puntos</p>
</div>
</div>
<!-- Redeem or add points -->
<div class="grid grid-cols-2 gap-4 text-xs font-bold">
<div class="bg-green-50 border border-green-100 rounded-2xl p-4">
<p class="text-green-700 font-black uppercase mb-2"><i class="w-4 h-4 inline mr-1" data-lucide="plus-circle"></i>Agregar Puntos</p>
<input class="w-full bg-white border border-green-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none mb-2" id="points-add-amount" min="1" placeholder="0" type="number"/>
<button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-xl transition text-xs" onclick="addClientPoints()">Agregar</button>
</div>
<div class="bg-red-50 border border-red-100 rounded-2xl p-4">
<p class="text-red-700 font-black uppercase mb-2"><i class="w-4 h-4 inline mr-1" data-lucide="minus-circle"></i>Canjear Puntos</p>
<input class="w-full bg-white border border-red-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none mb-2" id="points-redeem-amount" min="1" placeholder="0" type="number"/>
<button class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl transition text-xs" onclick="redeemClientPoints()">Canjear</button>
</div>
</div>
<!-- Points history -->
<div>
<p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Historial de Puntos</p>
<div class="border border-slate-100 rounded-xl overflow-hidden max-h-48 overflow-y-auto custom-scrollbar">
<table class="w-full text-[10px] border-collapse text-left">
<thead class="bg-slate-50 text-slate-400 font-bold border-b border-slate-100 sticky top-0">
<tr>
<th class="py-2 px-3">FECHA</th>
<th class="py-2 px-3">CONCEPTO</th>
<th class="py-2 px-3 text-right">PUNTOS</th>
</tr>
</thead>
<tbody class="divide-y divide-slate-50 text-slate-600 font-semibold" id="points-history-body">
<tr><td class="text-center py-4 text-slate-400" colspan="3">Sin movimientos registrados</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>
