<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden select-none" id="modal-parked-transfer-select">
<div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-[400px] p-5 font-montserrat font-bold text-xs text-slate-600 space-y-4">
<h3 class="font-black text-slate-800 text-sm uppercase tracking-wide flex items-center gap-1.5">
<i class="w-4 h-4 text-blue-500" data-lucide="arrow-right-left"></i>
<span>Transferir Sucursal</span>
</h3>
<p class="text-[11px] text-slate-400 leading-normal">Selecciona la sucursal de destino para enviar las cuentas seleccionadas:</p>
<div>
<select class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 text-sm font-semibold text-slate-800 focus:bg-white" id="transfer-dest-branch">
<option value="MATRIZ">MATRIZ</option>
<option value="BOULEVARD">BOULEVARD</option>
<option value="SUCURSAL NORTE">SUCURSAL NORTE</option>
<option value="SUCURSAL SUR">SUCURSAL SUR</option>
</select>
</div>
<div class="flex gap-2 justify-end pt-2">
<button class="bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold text-xs px-4 py-2 rounded-xl transition" onclick="closeModal('modal-parked-transfer-select')">
          Cancelar
        </button>
<button class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-xl transition" onclick="confirmTransferSelectedParked()">
          Confirmar (Enter)
        </button>
</div>
</div>
</div>
