[pytest]
# El suite se corre desde backend/ (los tests hacen `from main import ...`).
testpaths = tests

# test_dashboard.py::test_rate_limiting_headers es `async def` (httpx.AsyncClient).
# Con asyncio_mode=auto, pytest-asyncio ejecuta los tests async sin marcador
# explícito. pytest 9 ya no tolera un `async def` sin plugin: lo marca fallido.
asyncio_mode = auto

markers =
    pg: prueba que requiere PostgreSQL real vía TEST_DATABASE_URL (Zero-SQLite Rule)
